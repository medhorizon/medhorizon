name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            archive: zip
          - os: macos-latest
            target: macos-arm64
            archive: tar.gz
          - os: ubuntu-latest
            target: linux-x64
            archive: tar.gz

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.target }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: ./.github/actions/setup-bun

      - name: Build frontend + backend binary
        run: bun run script/build.ts --single
        working-directory: backend/cli
        env:
          MODELS_DEV_API_JSON: ""

      - name: Find binary (Unix)
        if: runner.os != 'Windows'
        run: |
          BINARY=$(find backend/cli/dist -type f -name "medhorizon" ! -name "*.map" | head -1)
          echo "Found binary: $BINARY"
          if [ -z "$BINARY" ]; then
            echo "Error: Binary not found"
            exit 1
          fi
          echo "BINARY=$BINARY" >> "$GITHUB_ENV"

      - name: Find binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $b = Get-ChildItem -Path "backend\cli\dist" -Recurse -Filter "medhorizon.exe" | Select-Object -First 1
          if (-not $b) {
            Write-Error "Error: Binary not found"
            exit 1
          }
          Write-Host "Found binary: $($b.FullName)"
          echo "BINARY=$($b.FullName)" >> $env:GITHUB_ENV

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release
          Copy-Item $env:BINARY release\medhorizon.exe
          Compress-Archive -Path release\medhorizon.exe -DestinationPath medhorizon-${{ matrix.target }}.zip

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p release
          cp "$BINARY" release/medhorizon
          chmod +x release/medhorizon
          tar -czf medhorizon-${{ matrix.target }}.tar.gz -C release medhorizon

      - name: Build Research Graph sidecar
        shell: bash
        run: |
          set -euo pipefail
          cd research-graph
          (cd frontend && npm ci --ignore-scripts && npm run build)
          rm -rf ui && mkdir -p ui && cp -R frontend/dist/. ui/
          python3 -m pip install -q -r backend/requirements.txt pyinstaller
          (cd sidecar && PYTHONPATH="$PWD/.." pyinstaller --noconfirm research-graph.spec)
          TARGET="${{ matrix.target }}"
          if [ -f sidecar/dist/research-graph.exe ]; then
            cp sidecar/dist/research-graph.exe "../research-graph-${TARGET}.exe"
          else
            cp sidecar/dist/research-graph "../research-graph-${TARGET}"
            chmod +x "../research-graph-${TARGET}"
          fi
          ls -lh ../research-graph-${TARGET}*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: medhorizon-${{ matrix.target }}
          path: |
            medhorizon-${{ matrix.target }}.${{ matrix.archive }}
            research-graph-${{ matrix.target }}*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Package binary installer archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          VERSION="${VERSION#v}"
          echo "$VERSION" > /tmp/VERSION
          ls -lah artifacts

          python3 - <<'PY'
          from pathlib import Path

          def rewrite(src: str, dest: str) -> None:
              raw = Path(src).read_bytes()
              text = raw.replace(b"\r\n", b"\n").replace(b"\r", b"\n").decode("ascii")
              out = text.replace("\n", "\r\n").encode("ascii")
              path = Path(dest)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(out)
              print(dest, "bytes", len(out), "crlf", out.count(b"\r\n"))

          for name in ("install.bat", "install.ps1", "start.bat"):
              rewrite(f"scripts/{name}", f"/tmp/win-scripts/{name}")
          PY

          # Windows installer with MedHorizon + Research Graph sidecar
          rm -rf /tmp/win-installer
          mkdir -p /tmp/win-installer
          unzip -o artifacts/medhorizon-windows-x64.zip -d /tmp/win-installer
          test -f /tmp/win-installer/medhorizon.exe
          cp artifacts/research-graph-windows-x64.exe /tmp/win-installer/research-graph.exe
          cp /tmp/win-scripts/install.bat /tmp/win-scripts/install.ps1 /tmp/win-scripts/start.bat /tmp/win-installer/
          cp /tmp/VERSION /tmp/win-installer/VERSION
          (cd /tmp/win-installer && zip -9 "$GITHUB_WORKSPACE/artifacts/medhorizon-windows-installer.zip" \
            medhorizon.exe research-graph.exe install.bat install.ps1 start.bat VERSION)
          # also refresh raw windows zip to include sidecar
          (cd /tmp/win-installer && zip -9 "$GITHUB_WORKSPACE/artifacts/medhorizon-windows-x64.zip" \
            medhorizon.exe research-graph.exe)

          # Linux installer
          rm -rf /tmp/linux-installer
          mkdir -p /tmp/linux-installer
          tar -xzf artifacts/medhorizon-linux-x64.tar.gz -C /tmp/linux-installer
          cp artifacts/research-graph-linux-x64 /tmp/linux-installer/research-graph
          cp scripts/install-local.sh /tmp/linux-installer/install.sh
          chmod +x /tmp/linux-installer/medhorizon /tmp/linux-installer/research-graph /tmp/linux-installer/install.sh
          cp /tmp/VERSION /tmp/linux-installer/VERSION
          tar -czf artifacts/medhorizon-linux-x64-installer.tar.gz -C /tmp/linux-installer \
            medhorizon research-graph install.sh VERSION
          tar -czf artifacts/medhorizon-linux-x64.tar.gz -C /tmp/linux-installer \
            medhorizon research-graph

          # macOS installer
          rm -rf /tmp/mac-installer
          mkdir -p /tmp/mac-installer
          tar -xzf artifacts/medhorizon-macos-arm64.tar.gz -C /tmp/mac-installer
          cp artifacts/research-graph-macos-arm64 /tmp/mac-installer/research-graph
          cp scripts/install-local.sh /tmp/mac-installer/install.sh
          chmod +x /tmp/mac-installer/medhorizon /tmp/mac-installer/research-graph /tmp/mac-installer/install.sh
          cp /tmp/VERSION /tmp/mac-installer/VERSION
          tar -czf artifacts/medhorizon-macos-arm64-installer.tar.gz -C /tmp/mac-installer \
            medhorizon research-graph install.sh VERSION
          tar -czf artifacts/medhorizon-macos-arm64.tar.gz -C /tmp/mac-installer \
            medhorizon research-graph

          # drop platform-specific intermediate sidecar names from release assets
          rm -f artifacts/research-graph-windows-x64.exe \
                artifacts/research-graph-linux-x64 \
                artifacts/research-graph-macos-arm64

          cd artifacts
          sha256sum ./* > checksums.txt
          echo "---- artifacts ----"
          ls -lh
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "MedHorizon ${{ github.ref_name }}"
          body: |
            ## MedHorizon v0.3.17 — 2026-08-03

            ### Added

            - **Session artifact catalog (plan 16):** RLMArtifacts register/resolve/list baseline frozen; session artifact metadata commits atomically with the `.dat` write as the single visibility commit, backed by paginated list, bounded preview, and download endpoints in the generated SDK.
            - **Local Explorer core shell (plan 16):** contract-driven `features/explorer` shell with a single Files adapter mounted in `session.tsx`; the host `FileExplorer` tree is unchanged and still browses host files through host endpoints only (zero `/api/atlas`).
            - **Scientific file routing (plan 19):** single backend `ScienceFile` detector (`family`/`format`/`mode`/`capability`/`readPolicy`) with frozen budgets, a shared canonical path resolver (rejects `..`, symlinks, cross-drive, and directory targets), and bounded inspect/preview/raw endpoints surfaced as `file.inspect`/`file.preview`/`file.raw` in the generated SDK.
            - **Project-file renderer registry (plan 19):** maps `capability × readPolicy` to the existing science renderers through a thin project wrapper that clips bounded content; GenomeTrack is not registered in v1, and empty/invalid input can never mount sample content.
            - **Hardened Dialog context (plan 06):** rebuilt Promise-based dialog helpers on a tightened context contract.

            ### Changed

            - SDK regenerated with the session-artifact catalog and science inspect routes; the generator is now Windows-portable (explicit `bun` invocation, `.prettierignore` excludes the Vite symlink stub).

            ### Fixed

            - The file-explorer E2E request capture no longer aborts page navigation when it hits an unparseable lifecycle URL.

            ## 一键安装

            ### Windows
            1. 下载 [`medhorizon-windows-installer.zip`](https://github.com/medhorizon/medhorizon/releases/download/${{ github.ref_name }}/medhorizon-windows-installer.zip)
            2. 解压后双击 `install.bat`（含 `medhorizon.exe` + `research-graph.exe`）

            ### macOS (Apple Silicon)
            ```bash
            curl -fsSL -o mh.tgz https://github.com/medhorizon/medhorizon/releases/download/${{ github.ref_name }}/medhorizon-macos-arm64-installer.tar.gz
            mkdir mh && tar -xzf mh.tgz -C mh && cd mh && ./install.sh
            ```

            ### Linux
            ```bash
            curl -fsSL -o mh.tgz https://github.com/medhorizon/medhorizon/releases/download/${{ github.ref_name }}/medhorizon-linux-x64-installer.tar.gz
            mkdir mh && tar -xzf mh.tgz -C mh && cd mh && ./install.sh
            ```

            ### 关闭 Research Graph
            设置环境变量 `RESEARCH_GRAPH_DISABLE=1` 可跳过 sidecar 与内置插件。

            ---
            完整说明见 [README](https://github.com/medhorizon/medhorizon#readme) · [CHANGELOG](https://github.com/medhorizon/medhorizon/blob/release/v0.3.17/CHANGELOG.md)
          files: |
            artifacts/*
          draft: false
          prerelease: false
